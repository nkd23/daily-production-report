; Đổi tên file này thành config.ini, để cạnh DayTienDo.exe.

[tien_do]
; Thư mục "Bảng tiến độ mới" đã đồng bộ về máy bằng OneDrive
; (bấm chuột phải thư mục trong File Explorer > "Always keep on this device").
thu_muc = C:\Users\TEN_MAY\OneDrive - TEN_CONG_TY\Bảng tiến độ mới

; Thư mục có file "THV PRODUCTION PLAN <ngày>.xlsm" - bỏ trống nếu nằm chung thư mục trên.
; Chương trình tự lấy file PRODUCTION PLAN sửa gần nhất.
thu_muc_plan =

; Địa chỉ API của web và khóa bí mật (lấy từ người quản trị web).
api = https://baocaosanluong-api.vercel.app
khoa = DIEN_KHOA_VAO_DAY
